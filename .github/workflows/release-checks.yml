name: Release checks

on:
  pull_request:
    paths:
      - 'model-eval/**'
      - '.github/workflows/release-checks.yml'
  push:
    branches:
      - 'release/**'

jobs:
  model-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-eval
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
