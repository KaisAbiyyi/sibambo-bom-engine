<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BOM Engine Export</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    background: #1e2229;
    color: #e0e4ea;
    padding: 20px;
  }

  h2 {
    font-size: 16px;
    font-weight: 600;
    color: #4fffb0;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 11px;
    color: #8899aa;
    margin-bottom: 5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    background: #141720;
    border: 1px solid #2e3340;
    border-radius: 5px;
    color: #e0e4ea;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus { border-color: #4fffb0; }

  .path-row { display: flex; gap: 8px; }
  .path-row input { flex: 1; }

  .btn {
    padding: 8px 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn-browse { background: #2e3340; color: #aab; }
  .btn-browse:hover { background: #3a4050; }

  .section {
    background: #151a22;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section h3 {
    font-size: 11px;
    text-transform: uppercase;
    color: #4fffb0;
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .checkbox-row:last-child { margin-bottom: 0; }
  .checkbox-row input[type=checkbox] {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: #4fffb0;
    flex-shrink: 0;
  }
  .checkbox-row label {
    text-transform: none;
    font-size: 13px;
    color: #c0ccd8;
    letter-spacing: 0;
    cursor: pointer;
  }

  .info {
    font-size: 11px;
    color: #556677;
    margin-top: 5px;
    line-height: 1.5;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .btn-cancel {
    background: #2e3340;
    color: #778899;
    padding: 10px 22px;
    border-radius: 6px;
  }
  .btn-cancel:hover { background: #3a4050; }
  .btn-export {
    background: #4fffb0;
    color: #111;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .btn-export:hover { background: #3de89d; }

  .badge {
    display: inline-block;
    font-size: 10px;
    background: #2e3340;
    color: #4fffb0;
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 5px;
    vertical-align: middle;
  }
</style>
</head>
<body>

  <h2>&#11041; BOM Engine Export <span class="badge">v2.0</span></h2>

  <div class="field">
    <label>Output JSON Path</label>
    <div class="path-row">
      <input type="text" id="outputPath" placeholder="/path/to/output_bom.json">
      <button class="btn btn-browse" onclick="sketchup.browse()">Browse</button>
    </div>
  </div>

  <div class="section">
    <h3>Opsi Export</h3>
    <div class="checkbox-row">
      <input type="checkbox" id="exportTextures" checked>
      <label for="exportTextures">Export tekstur ke subfolder /textures</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="includeEdges">
      <label for="includeEdges">Sertakan edge entities (memperbesar ukuran file)</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="includeMaterials" checked>
      <label for="includeMaterials">Sertakan library material lengkap</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="prettyPrint" checked>
      <label for="prettyPrint">Pretty-print JSON (mudah dibaca manusia)</label>
    </div>
  </div>

  <div class="section">
    <h3>Cakupan Export</h3>
    <div class="checkbox-row" id="selectionRow">
      <input type="checkbox" id="selectionOnly">
      <label for="selectionOnly" id="selectionLabel">Hanya objek yang diseleksi</label>
    </div>
    <p class="info" id="selectionInfo">Pilih objek di SketchUp terlebih dahulu untuk mengaktifkan opsi ini.</p>
  </div>

  <div class="section">
    <h3>Sistem Koordinat</h3>
    <div class="checkbox-row">
      <input type="checkbox" id="useWorldSpace" checked disabled>
      <label for="useWorldSpace">Semua koordinat dalam world space (absolut, meter)</label>
    </div>
    <p class="info">
      Semua vertex diekspor dalam koordinat world-space (satuan: meter, SI).<br>
      Konversi: SketchUp inches &times; 0.0254. Sumbu Y SketchUp = sumbu Y JSON.
    </p>
  </div>

  <div class="actions">
    <button class="btn btn-cancel" onclick="sketchup.cancel()">Batal</button>
    <button class="btn btn-export" onclick="doExport()">Export JSON</button>
  </div>

<script>
  function setDefaultPath(path) {
    document.getElementById('outputPath').value = path;
  }

  function setPath(path) {
    document.getElementById('outputPath').value = path;
  }

  // Called by Ruby after dialog ready — configures the selection checkbox state.
  // hasSelection: ada objek diseleksi di SketchUp
  // forceSelection: dibuka via "Export Selection..." sehingga langsung dicentang & dikunci
  function setSelectionState(hasSelection, forceSelection) {
    var cb    = document.getElementById('selectionOnly');
    var info  = document.getElementById('selectionInfo');
    var label = document.getElementById('selectionLabel');

    if (hasSelection) {
      cb.disabled = false;
      label.style.color = '#c0ccd8';
      if (forceSelection) {
        cb.checked  = true;
        cb.disabled = true;  // lock: opened from "Export Selection" menu
        info.textContent = 'Hanya komponen yang sedang diseleksi yang akan diekspor.';
        info.style.color = '#4fffb0';
      } else {
        info.textContent = 'Ada seleksi aktif. Centang untuk mengekspor seleksi saja.';
      }
    } else {
      cb.disabled = true;
      cb.checked  = false;
      label.style.color = '#445566';
      info.textContent  = 'Tidak ada objek yang diseleksi — akan mengekspor seluruh model.';
    }
  }

  function doExport() {
    var outputPath = document.getElementById('outputPath').value.trim();
    if (!outputPath) {
      alert('Harap tentukan path output terlebih dahulu.');
      return;
    }
    var settings = {
      output_path:       outputPath,
      export_textures:   document.getElementById('exportTextures').checked,
      include_edges:     document.getElementById('includeEdges').checked,
      include_materials: document.getElementById('includeMaterials').checked,
      pretty_print:      document.getElementById('prettyPrint').checked,
      selection_only:    document.getElementById('selectionOnly').checked
    };
    sketchup.export(JSON.stringify(settings));
  }

  window.onload = function() {
    sketchup.onReady();
  };
</script>

</body>
</html>
